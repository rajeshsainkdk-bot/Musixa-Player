name: Build Musixa Player (Play Store AAB & Release APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project with Native Flutter Wrapper
        run: |
          # Preserve any custom launcher icons if present
          mkdir -p /tmp/icon_backup
          cp -r android/app/src/main/res/mipmap* /tmp/icon_backup/ 2>/dev/null || true
          
          rm -rf android
          flutter create . --platforms=android --org=com.musixa --project-name=musixa_player

          # Restore custom launcher icons
          cp -r /tmp/icon_backup/mipmap* android/app/src/main/res/ 2>/dev/null || true

      - name: Configure Play Store Android Manifest
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <!-- Media Storage Permissions compliant with Google Play Policies (Audio & Video) -->
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <application
                  android:label="Musixa Player"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <!-- Google AdMob Application ID -->
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>

                  <!-- MainActivity extending AudioServiceActivity -->
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:supportsPictureInPicture="true"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <!-- Default Media Player Filters: Audio -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:mimeType="audio/*" />
                          <data android:scheme="file" />
                          <data android:scheme="content" />
                      </intent-filter>

                      <!-- Default Media Player Filters: Video -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:mimeType="video/*" />
                          <data android:scheme="file" />
                          <data android:scheme="content" />
                      </intent-filter>
                  </activity>

                  <!-- AudioService for Background Playback & Notification Controls -->
                  <service 
                      android:name="com.ryanheise.audioservice.AudioService" 
                      android:foregroundServiceType="mediaPlayback" 
                      android:exported="true" 
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>

                  <!-- MediaButtonReceiver for Notification Bar and Headphone Buttons -->
                  <receiver 
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver" 
                      android:exported="true" 
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Configure Native MainActivity
        run: |
          rm -rf android/app/src/main/kotlin/com/musixa/*
          mkdir -p android/app/src/main/kotlin/com/musixa/musixa_player
          cat << 'EOF' > android/app/src/main/kotlin/com/musixa/musixa_player/MainActivity.kt
          package com.musixa.musixa_player

          import android.content.Context
          import android.content.Intent
          import android.content.ContentUris
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import com.ryanheise.audioservice.AudioServiceActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: AudioServiceActivity() {
              private val CHANNEL = "com.musixa.player/app_share"
              private var initialMediaUri: String? = null
              private var initialMediaMime: String? = null
              private var initialMediaName: String? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  handleIncomingIntent(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  handleIncomingIntent(intent)
              }

              private fun handleIncomingIntent(inIntent: Intent?) {
                  if (inIntent == null) return
                  val action = inIntent.action
                  val data: Uri? = inIntent.data
                  if (Intent.ACTION_VIEW == action && data != null) {
                      initialMediaUri = data.toString()
                      initialMediaMime = inIntent.type ?: contentResolver.getType(data)
                      initialMediaName = data.lastPathSegment ?: "Media File"
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val ctx: Context = applicationContext
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "keepScreenOn" -> {
                              val enable = call.argument<Boolean>("enable") ?: true
                              runOnUiThread {
                                  if (enable) {
                                      window.addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                                  } else {
                                      window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                                  }
                              }
                              result.success(true)
                          }
                          "setScreenBrightness" -> {
                              val brightness = call.argument<Double>("brightness")?.toFloat() ?: -1.0f
                              runOnUiThread {
                                  val lp = window.attributes
                                  lp.screenBrightness = brightness.coerceIn(0.01f, 1.0f)
                                  window.attributes = lp
                              }
                              result.success(true)
                          }
                          "getScreenBrightness" -> {
                              val brightness = window.attributes.screenBrightness
                              result.success(if (brightness < 0) 0.5 else brightness.toDouble())
                          }
                          "setDeviceVolume" -> {
                              try {
                                  val volumePercent = call.argument<Double>("volume") ?: 0.5
                                  val audioManager = getSystemService(android.content.Context.AUDIO_SERVICE) as android.media.AudioManager
                                  val maxVol = audioManager.getStreamMaxVolume(android.media.AudioManager.STREAM_MUSIC)
                                  val targetVol = (volumePercent * maxVol).toInt().coerceIn(0, maxVol)
                                  audioManager.setStreamVolume(android.media.AudioManager.STREAM_MUSIC, targetVol, 0)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error("VOL_ERROR", e.message, null)
                              }
                          }
                          "getDeviceVolume" -> {
                              try {
                                  val audioManager = getSystemService(android.content.Context.AUDIO_SERVICE) as android.media.AudioManager
                                  val maxVol = audioManager.getStreamMaxVolume(android.media.AudioManager.STREAM_MUSIC)
                                  val curVol = audioManager.getStreamVolume(android.media.AudioManager.STREAM_MUSIC)
                                  result.success(if (maxVol > 0) curVol.toDouble() / maxVol.toDouble() else 0.5)
                              } catch (e: Exception) {
                                  result.success(0.5)
                              }
                          }
                          "enterPipMode" -> {
                              if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                                  try {
                                      val params = android.app.PictureInPictureParams.Builder()
                                          .setAspectRatio(android.util.Rational(16, 9))
                                          .build()
                                      enterPictureInPictureMode(params)
                                      result.success(true)
                                  } catch (e: Exception) {
                                      result.success(false)
                                  }
                              } else {
                                  result.success(false)
                              }
                          }
                          "getInitialMediaUri" -> {
                              if (initialMediaUri != null) {
                                  val uriStr = initialMediaUri ?: ""
                                  val mime = initialMediaMime ?: ""
                                  val isVideo = mime.startsWith("video") ||
                                          uriStr.endsWith(".mp4", ignoreCase = true) ||
                                          uriStr.endsWith(".mkv", ignoreCase = true) ||
                                          uriStr.endsWith(".webm", ignoreCase = true)
                                  val isAudio = mime.startsWith("audio") ||
                                          uriStr.endsWith(".mp3", ignoreCase = true) ||
                                          uriStr.endsWith(".m4a", ignoreCase = true) ||
                                          uriStr.endsWith(".wav", ignoreCase = true)

                                  val map = mapOf(
                                      "uri" to uriStr,
                                      "mimeType" to mime,
                                      "displayName" to (initialMediaName ?: "Media File"),
                                      "isVideo" to isVideo,
                                      "isAudio" to isAudio
                                  )
                                  initialMediaUri = null
                                  result.success(map)
                              } else {
                                  result.success(null)
                              }
                          }
                          "queryDeviceVideos" -> {
                              try {
                                  val videoList = mutableListOf<Map<String, Any?>>()
                                  val projection = arrayOf(
                                      MediaStore.Video.Media._ID,
                                      MediaStore.Video.Media.TITLE,
                                      MediaStore.Video.Media.DISPLAY_NAME,
                                      MediaStore.Video.Media.DATA,
                                      MediaStore.Video.Media.DURATION,
                                      MediaStore.Video.Media.SIZE,
                                      MediaStore.Video.Media.RESOLUTION,
                                      MediaStore.Video.Media.BUCKET_DISPLAY_NAME,
                                      MediaStore.Video.Media.DATE_ADDED
                                  )
                                  val cursor = ctx.contentResolver.query(
                                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                                      projection,
                                      null,
                                      null,
                                      "${MediaStore.Video.Media.DATE_ADDED} DESC"
                                  )
                                  cursor?.use { c ->
                                      val idCol = c.getColumnIndex(MediaStore.Video.Media._ID)
                                      val titleCol = c.getColumnIndex(MediaStore.Video.Media.TITLE)
                                      val nameCol = c.getColumnIndex(MediaStore.Video.Media.DISPLAY_NAME)
                                      val pathCol = c.getColumnIndex(MediaStore.Video.Media.DATA)
                                      val durCol = c.getColumnIndex(MediaStore.Video.Media.DURATION)
                                      val sizeCol = c.getColumnIndex(MediaStore.Video.Media.SIZE)
                                      val resCol = c.getColumnIndex(MediaStore.Video.Media.RESOLUTION)
                                      val bucketCol = c.getColumnIndex(MediaStore.Video.Media.BUCKET_DISPLAY_NAME)
                                      val dateCol = c.getColumnIndex(MediaStore.Video.Media.DATE_ADDED)

                                      while (c.moveToNext()) {
                                          val id = if (idCol != -1) c.getLong(idCol) else 0L
                                          val title = if (titleCol != -1) c.getString(titleCol) else null
                                          val name = if (nameCol != -1) c.getString(nameCol) else null
                                          val path = if (pathCol != -1) c.getString(pathCol) else ""
                                          val duration = if (durCol != -1) c.getLong(durCol) else 0L
                                          val size = if (sizeCol != -1) c.getLong(sizeCol) else 0L
                                          val resolution = if (resCol != -1) c.getString(resCol) else null
                                          val folder = if (bucketCol != -1) c.getString(bucketCol) else null
                                          val dateAdded = if (dateCol != -1) c.getLong(dateCol) else 0L

                                          videoList.add(mapOf(
                                              "id" to id.toString(),
                                              "title" to (title ?: name ?: "Video"),
                                              "displayName" to (name ?: "Video"),
                                              "path" to path,
                                              "duration" to duration,
                                              "size" to size,
                                              "resolution" to (resolution ?: "HD"),
                                              "folder" to (folder ?: "Videos"),
                                              "dateAdded" to dateAdded
                                          ))
                                      }
                                  }
                                  result.success(videoList)
                              } catch (e: Exception) {
                                  result.error("VIDEO_QUERY_ERR", e.localizedMessage, null)
                              }
                          }
                          "openVideoWithApp" -> {
                              try {
                                  val path = call.argument<String>("path") ?: ""
                                  val idStr = call.argument<String>("id")
                                  val intent = Intent(Intent.ACTION_VIEW).apply {
                                      if (!idStr.isNullOrEmpty() && idStr.toLongOrNull() != null) {
                                          val uri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, idStr.toLong())
                                          setDataAndType(uri, "video/*")
                                      } else {
                                          setDataAndType(Uri.parse(path), "video/*")
                                      }
                                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  }
                                  val chooser = Intent.createChooser(intent, "Play Video With").apply {
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  }
                                  ctx.startActivity(chooser)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error("OPEN_VIDEO_ERR", e.localizedMessage, null)
                              }
                          }
                          "acquireWakeLock" -> result.success(true)
                          "releaseWakeLock" -> result.success(true)
                          "showUploadNotification" -> result.success(true)
                          "shareApk" -> {
                              try {
                                  val shareIntent = Intent(Intent.ACTION_SEND).apply {
                                      type = "text/plain"
                                      putExtra(Intent.EXTRA_SUBJECT, "Musixa Player")
                                      putExtra(Intent.EXTRA_TEXT, "Listen to high-res music & watch videos with AI Clarity on Musixa Player: https://play.google.com/store/apps/details?id=com.musixa.player")
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  }
                                  val chooser = Intent.createChooser(shareIntent, "Share Musixa Player").apply {
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  }
                                  applicationContext.startActivity(chooser)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error("SHARE_ERROR", e.localizedMessage, null)
                              }
                          }
                          "getAppVersion" -> {
                              try {
                                  val pInfo = if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.P) {
                                      applicationContext.packageManager.getPackageInfo(applicationContext.packageName, 0).longVersionCode
                                  } else {
                                      @Suppress("DEPRECATION")
                                      applicationContext.packageManager.getPackageInfo(applicationContext.packageName, 0).versionCode.toLong()
                                  }
                                  val versionName = applicationContext.packageManager.getPackageInfo(applicationContext.packageName, 0).versionName ?: "1.0.0"
                                  result.success(mapOf(
                                      "versionCode" to pInfo,
                                      "versionName" to versionName
                                  ))
                              } catch (e: Exception) {
                                  result.error("VERSION_ERROR", e.localizedMessage, null)
                              }
                          }
                          "getVideoThumbnail" -> {
                              val path = call.argument<String>("path") ?: ""
                              val idStr = call.argument<String>("id")
                              val id = idStr?.toLongOrNull()

                              Thread {
                                  try {
                                      var bitmap: android.graphics.Bitmap? = null

                                      if (id != null && id > 0 && android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.Q) {
                                          try {
                                              val contentUri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)
                                              bitmap = applicationContext.contentResolver.loadThumbnail(contentUri, android.util.Size(320, 240), null)
                                          } catch (_: Throwable) {}
                                      }

                                      if (bitmap == null && path.isNotEmpty()) {
                                          val retriever = android.media.MediaMetadataRetriever()
                                          try {
                                              if (path.startsWith("content://")) {
                                                  retriever.setDataSource(applicationContext, Uri.parse(path))
                                              } else {
                                                  retriever.setDataSource(path)
                                              }
                                              bitmap = retriever.getFrameAtTime(1000000, android.media.MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                                                  ?: retriever.frameAtTime
                                          } catch (_: Throwable) {
                                          } finally {
                                              try { retriever.release() } catch (_: Throwable) {}
                                          }
                                      }

                                      if (bitmap == null && path.isNotEmpty() && !path.startsWith("content://")) {
                                          try {
                                              @Suppress("DEPRECATION")
                                              bitmap = android.media.ThumbnailUtils.createVideoThumbnail(
                                                  path,
                                                  MediaStore.Images.Thumbnails.MINI_KIND
                                              )
                                          } catch (_: Throwable) {}
                                      }

                                      if (bitmap != null) {
                                          val stream = java.io.ByteArrayOutputStream()
                                          bitmap.compress(android.graphics.Bitmap.CompressFormat.JPEG, 75, stream)
                                          val bytes = stream.toByteArray()
                                          bitmap.recycle()
                                          runOnUiThread { result.success(bytes) }
                                      } else {
                                          runOnUiThread { result.success(null) }
                                      }
                                  } catch (_: Throwable) {
                                      runOnUiThread { result.success(null) }
                                  }
                              }.start()
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }
          EOF

      - name: Configure Android Gradle Settings and Keystore Signing
        run: |
          sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
          sed -i -E 's/ext\.kotlin_version = "[^"]+"/ext.kotlin_version = "1.9.24"/' android/build.gradle 2>/dev/null || true
          sed -i -E "s/ext\.kotlin_version = '[^']+'/ext.kotlin_version = '1.9.24'/" android/build.gradle 2>/dev/null || true
          sed -i 's/minSdkVersion .*/minSdkVersion = 21/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle || true
          sed -i 's/applicationId .*/applicationId = "com.musixa.player"/' android/app/build.gradle || true

          cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                          details.useVersion '1.9.24'
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' | base64 -d > android/app/msixa_release.jks
          
          EOF

          python - << 'EOF'
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('msixa_release.jks')
                      storePassword 'msixaplayer123'
                      keyAlias 'msixakey'
                      keyPassword 'msixaplayer123'
                  }
              }
          """

          if 'signingConfigs {' not in content:
              content = content.replace('buildTypes {', signing_block + '\n    buildTypes {')

          content = content.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
          content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          print("Signed release successfully in build.gradle")
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Release Gate Tests
        run: |
          rm -f test/widget_test.dart
          flutter test test/musixa_features_test.dart

      - name: Build Google Play Store App Bundle (AAB)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build Standalone Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Google Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Musixa-Player-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Standalone Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Musixa-Player-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Deploy Live Musixa Player OTA Update to Cloudflare R2
        run: |
          pip install boto3
          python - << 'EOF'
          import boto3, os, json
          s3 = boto3.client(
              's3',
              endpoint_url='https://25622df2e6919b63cf30e7d06532d778.r2.cloudflarestorage.com',
              aws_access_key_id='3857da30609fecfde1e88f56c842f7f1',
              aws_secret_access_key='77ef640b75cc5d1858ef76bb88872d8baeed1c60f581d4ef0280e67a43dd4ddd',
              region_name='auto'
          )
          run_num = int(os.environ.get('GITHUB_RUN_NUMBER', 1))
          apk_path = 'build/app/outputs/flutter-apk/app-release.apk'
          if os.path.exists(apk_path):
              size_mb = round(os.path.getsize(apk_path) / (1024 * 1024), 2)
              print(f"Uploading {apk_path} ({size_mb} MB) to R2 update/musixa_player_latest.apk...")
              s3.upload_file(
                  apk_path,
                  'msixa-music',
                  'update/musixa_player_latest.apk',
                  ExtraArgs={'ContentType': 'application/vnd.android.package-archive'}
              )
              manifest = {
                  'version_code': run_num,
                  'version_name': f"1.0.{run_num}",
                  'apk_url': 'https://pub-d4f2e58dc2594d0c8dc1f30bbae4344f.r2.dev/update/musixa_player_latest.apk',
                  'file_size_mb': size_mb,
                  'release_notes': "Musixa Player Pro: Authentic MX Player Video UI, real video thumbnails, subtitle badges, and gesture HUD controls!",
                  'force_update': False
              }
              s3.put_object(
                  Bucket='msixa-music',
                  Key='update/musixa_player_version.json',
                  Body=json.dumps(manifest),
                  ContentType='application/json'
              )
              if os.path.exists('privacy_policy.html'):
                  s3.upload_file(
                      'privacy_policy.html',
                      'msixa-music',
                      'privacy_policy.html',
                      ExtraArgs={'ContentType': 'text/html; charset=utf-8'}
                  )
                  print("Privacy Policy deployed to R2!")
              print("Musixa Player OTA Update successfully deployed to Cloudflare R2!")
          EOF
