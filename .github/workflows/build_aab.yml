name: Build Musixa Player (Play Store AAB & Release APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project with Native Flutter Wrapper
        run: |
          # Preserve any custom launcher icons if present
          mkdir -p /tmp/icon_backup
          cp -r android/app/src/main/res/mipmap* /tmp/icon_backup/ 2>/dev/null || true
          
          rm -rf android
          flutter create . --platforms=android --org=com.musixa

          # Restore custom launcher icons
          cp -r /tmp/icon_backup/mipmap* android/app/src/main/res/ 2>/dev/null || true

      - name: Configure Play Store Android Manifest
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <!-- Audio-only Storage Permissions compliant with Google Play Policies -->
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <application
                  android:label="Musixa Player"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <!-- Google AdMob Application ID -->
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>

                  <!-- MainActivity extending AudioServiceActivity -->
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <!-- AudioService for Background Playback & Notification Controls -->
                  <service 
                      android:name="com.ryanheise.audioservice.AudioService" 
                      android:foregroundServiceType="mediaPlayback" 
                      android:exported="true" 
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>

                  <!-- MediaButtonReceiver for Notification Bar and Headphone Buttons -->
                  <receiver 
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver" 
                      android:exported="true" 
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Configure Native MainActivity
        run: |
          rm -rf android/app/src/main/kotlin/com/musixa/*
          mkdir -p android/app/src/main/kotlin/com/musixa/musixa_player
          cat << 'EOF' > android/app/src/main/kotlin/com/musixa/musixa_player/MainActivity.kt
          package com.musixa.musixa_player

          import android.content.Context
          import android.content.Intent
          import com.ryanheise.audioservice.AudioServiceActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: AudioServiceActivity() {
              private val CHANNEL = "com.msixa.player/app_share"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "acquireWakeLock" -> result.success(true)
                          "releaseWakeLock" -> result.success(true)
                          "showUploadNotification" -> result.success(true)
                          "shareApk" -> {
                              try {
                                  val shareIntent = Intent(Intent.ACTION_SEND).apply {
                                      type = "text/plain"
                                      putExtra(Intent.EXTRA_SUBJECT, "Musixa Player")
                                      putExtra(Intent.EXTRA_TEXT, "Listen to high-res music & 10-band equalizer on Musixa Player: https://play.google.com/store/apps/details?id=com.musixa.player")
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  }
                                  val chooser = Intent.createChooser(shareIntent, "Share Musixa Player").apply {
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  }
                                  applicationContext.startActivity(chooser)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error("SHARE_ERROR", e.localizedMessage, null)
                              }
                          }
                          "getAppVersion" -> {
                              try {
                                  val pInfo = if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.P) {
                                      applicationContext.packageManager.getPackageInfo(applicationContext.packageName, 0).longVersionCode
                                  } else {
                                      @Suppress("DEPRECATION")
                                      applicationContext.packageManager.getPackageInfo(applicationContext.packageName, 0).versionCode.toLong()
                                  }
                                  val versionName = applicationContext.packageManager.getPackageInfo(applicationContext.packageName, 0).versionName ?: "1.0.0"
                                  result.success(mapOf(
                                      "versionCode" to pInfo,
                                      "versionName" to versionName
                                  ))
                              } catch (e: Exception) {
                                  result.error("VERSION_ERROR", e.localizedMessage, null)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }
          EOF

      - name: Configure Android Gradle Settings and Keystore Signing
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion = 21/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle || true
          sed -i 's/applicationId .*/applicationId = "com.musixa.player"/' android/app/build.gradle || true

          cat << 'EOF' | base64 -d > android/app/msixa_release.jks
          
          EOF

          python - << 'EOF'
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('msixa_release.jks')
                      storePassword 'msixaplayer123'
                      keyAlias 'msixakey'
                      keyPassword 'msixaplayer123'
                  }
              }
          """

          if 'signingConfigs {' not in content:
              content = content.replace('buildTypes {', signing_block + '\n    buildTypes {')

          content = content.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
          content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          print("Signed release successfully in build.gradle")
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Release Gate Tests
        run: |
          rm -f test/widget_test.dart
          flutter test test/msixa_features_test.dart

      - name: Build Google Play Store App Bundle (AAB)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build Standalone Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Google Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Musixa-Player-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Standalone Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Musixa-Player-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
