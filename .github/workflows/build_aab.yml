name: Build Musixa Player (Play Store AAB & Release APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Release Gate Tests
        run: |
          rm -f test/widget_test.dart
          flutter test test/msixa_features_test.dart

      - name: Build Google Play Store App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Build Standalone Release APK
        run: flutter build apk --release

      - name: Upload Google Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Musixa-Player-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Standalone Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Musixa-Player-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

